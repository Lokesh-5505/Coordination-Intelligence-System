kind = "web"
previewPath = "/"
title = "Coordination Intelligence"
description = "A responsive project coordination workspace for mixed-use construction teams. It connects stakeholders, responsibilities, changes, dependencies, approvals, actions and project memory, with grounded impact analysis for the Riverside Mixed-Use Development demo."
version = "1.0.0"
id = "artifacts/coordination-intelligence"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20070

[services.development]
run = "pnpm --filter @workspace/coordination-intelligence run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/coordination-intelligence", "run", "build" ]
serve = "static"
publicDir = "artifacts/coordination-intelligence/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20070"
BASE_PATH = "/"
