services:
  - type: web
    name: coordination-intelligence-api
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm run build
    startCommand: node --enable-source-maps server/dist/index.mjs
    envVars:
      - key: PORT
        value: 5000
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
